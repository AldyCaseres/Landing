<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Luna - Mis XV</title>

<style>

body{
margin:0;
font-family:Arial;
background:#ffe6f0;
text-align:center;
color:#5a2a4d;
}

section{
padding:60px 20px;
}

h1{
font-size:50px;
margin-bottom:10px;
}

h2{
font-size:30px;
}

.contador{
font-size:40px;
margin-top:20px;
font-weight:bold;
}

.boton{
background:#ff4da6;
color:white;
padding:15px 30px;
border-radius:30px;
text-decoration:none;
font-size:18px;
display:inline-block;
margin-top:20px;
}

.carrusel{
width:300px;
height:350px;
margin:auto;
overflow:hidden;
border-radius:20px;
}

.carrusel img{
width:100%;
height:350px;
object-fit:cover;
}

.dress{
font-size:20px;
background:#ffd6ec;
display:inline-block;
padding:15px 30px;
border-radius:15px;
}

</style>
</head>

<body>

<section>

<h1>Luna</h1>
<h2>Mis XV</h2>

<p>Te invito a celebrar conmigo este día tan especial</p>

<div class="contador" id="contador"></div>

</section>

<section>

<h2>📷 Recuerdos</h2>

<div class="carrusel">
<img id="foto" src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e">
</div>

</section>

<section>

<h2>📍 Ubicación</h2>

<p>Salón Jardín de Sueños</p>

<iframe
src="https://maps.google.com/maps?q=buenos%20aires&t=&z=13&ie=UTF8&iwloc=&output=embed"
width="80%" height="300">
</iframe>

</section>

<section>

<h2>👗 Dress Code</h2>

<div class="dress">
Elegante
</div>

</section>

<section>

<h2>Confirmar asistencia</h2>

<a class="boton" href="https://wa.me/5491112345678">
Confirmar por WhatsApp
</a>

</section>


<script>

/* CONTADOR */

var fechaEvento = new Date("July 10, 2026 21:00:00").getTime();

var x = setInterval(function() {

var ahora = new Date().getTime();
var distancia = fechaEvento - ahora;

var dias = Math.floor(distancia / (1000 * 60 * 60 * 24));

document.getElementById("contador").innerHTML =
"Faltan " + dias + " días";

}, 1000);


/* CARRUSEL */

var fotos = [
"https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e",
"https://images.unsplash.com/photo-1494790108377-be9c29b29330",
"https://images.unsplash.com/photo-1517841905240-472988babdf9"
];

var i = 0;

setInterval(function(){

i++;

if(i >= fotos.length){
i = 0;
}

document.getElementById("foto").src = fotos[i];

},3000);

</script>

</body>
</html>

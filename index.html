<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Luna - Mis XV</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet">

<style>

body{
font-family: 'Playfair Display', serif;
background:#ffe6f2;
text-align:center;
}

.hero{
background:linear-gradient(135deg,#ffb6d9,#ffcce6);
color:white;
padding:120px 20px;
}

.hero h1{
font-size:70px;
}

.hero h2{
font-size:40px;
}

.contador{
font-size:40px;
margin-top:20px;
font-weight:bold;
}

.section1{
background:#fff0f7;
padding:80px 20px;
}

.section2{
background:#ffd9ec;
padding:80px 20px;
}

.section3{
background:#ffe6f5;
padding:80px 20px;
}

.section4{
background:#ffcce6;
padding:80px 20px;
}

.btn-confirmar{
background:#ff4da6;
border:none;
padding:15px 35px;
font-size:20px;
border-radius:30px;
color:white;
}

.btn-confirmar:hover{
background:#ff1a8c;
}

.dress{
font-size:24px;
background:white;
display:inline-block;
padding:15px 35px;
border-radius:20px;
}

.carousel img{
height:400px;
object-fit:cover;
border-radius:20px;
}

</style>

</head>

<body>

<!-- HERO -->

<section class="hero">

<h1>Luna</h1>
<h2>Mis XV</h2>

<p>Te invito a celebrar conmigo este día tan especial</p>

<div class="contador" id="contador"></div>

</section>


<!-- FOTOS -->

<section class="section1">

<h2>Recuerdos</h2>

<div class="container mt-4">

<div id="carouselExample" class="carousel slide">

<div class="carousel-inner">

<div class="carousel-item active">
<img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e" class="d-block w-100">
</div>

<div class="carousel-item">
<img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330" class="d-block w-100">
</div>

<div class="carousel-item">
<img src="https://images.unsplash.com/photo-1517841905240-472988babdf9" class="d-block w-100">
</div>

</div>

<button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
<span class="carousel-control-prev-icon"></span>
</button>

<button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
<span class="carousel-control-next-icon"></span>
</button>

</div>

</div>

</section>


<!-- UBICACION -->

<section class="section2">

<h2>Ubicación</h2>

<p>Salón Jardín de Sueños</p>

<div class="container">

<iframe
src="https://maps.google.com/maps?q=buenos%20aires&t=&z=13&ie=UTF8&iwloc=&output=embed"
width="100%" height="350" style="border-radius:20px;border:none;">
</iframe>

</div>

</section>


<!-- DRESS CODE -->

<section class="section3">

<h2>Dress Code</h2>

<div class="dress">
Elegante
</div>

</section>


<!-- CONFIRMAR -->

<section class="section4">

<h2>Confirmar asistencia</h2>

<a href="https://wa.me/5491112345678" class="btn-confirmar">
Confirmar por WhatsApp
</a>

</section>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

var fechaEvento = new Date("July 10, 2026 21:00:00").getTime();

var x = setInterval(function(){

var ahora = new Date().getTime();
var distancia = fechaEvento - ahora;

var dias = Math.floor(distancia / (1000*60*60*24));

document.getElementById("contador").innerHTML =
"Faltan " + dias + " días";

},1000);

</script>

</body>
</html>

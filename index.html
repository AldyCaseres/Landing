<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Luna - Mis XV</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">

<style>

body{
font-family: 'Playfair Display', serif;
margin:0;
background:#fff6fb;
}

/* PORTADA */

.hero{

height:100vh;
background-image:url("https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e");

background-size:cover;
background-position:center;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
position:relative;
}

.hero::before{
content:"";
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.45);
}

.hero-content{
position:relative;
z-index:2;
}

.hero h1{
font-family:'Great Vibes',cursive;
font-size:70px;
}

.hero h2{
letter-spacing:4px;
font-size:28px;
}

.scroll{
margin-top:30px;
font-size:18px;
}

/* SECCIONES */

section{
padding:80px 20px;
text-align:center;
}

.section-light{
background:white;
}

.section-pink{
background:#ffe6f2;
}

.contador{
font-size:40px;
margin-top:20px;
color:#d63384;
}

/* BOTON */

.btn-confirmar{
background:#d63384;
color:white;
padding:15px 40px;
border-radius:30px;
font-size:20px;
text-decoration:none;
}

.btn-confirmar:hover{
background:#b81f6e;
}

/* CARRUSEL */

.carousel img{
height:420px;
object-fit:cover;
border-radius:15px;
}

.dress{
font-size:24px;
background:#fff0f7;
display:inline-block;
padding:15px 35px;
border-radius:20px;
}

</style>

</head>

<body>

<!-- PORTADA -->

<section class="hero">

<div class="hero-content">

<h1>Luna</h1>
<h2>MIS XV</h2>

<p>Te invito a celebrar este día tan especial</p>

<div class="contador" id="contador"></div>

<div class="scroll">Desliza ↓</div>

</div>

</section>

<!-- FOTOS -->

<section class="section-light">

<h2>Galería</h2>

<div class="container mt-4">

<div id="carouselExample" class="carousel slide">

<div class="carousel-inner">

<div class="carousel-item active">
<img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e" class="d-block w-100">
</div>

<div class="carousel-item">
<img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330" class="d-block w-100">
</div>

<div class="carousel-item">
<img src="https://images.unsplash.com/photo-1517841905240-472988babdf9" class="d-block w-100">
</div>

</div>

<button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
<span class="carousel-control-prev-icon"></span>
</button>

<button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
<span class="carousel-control-next-icon"></span>
</button>

</div>

</div>

</section>

<!-- UBICACION -->

<section class="section-pink">

<h2>Ubicación</h2>

<p>Salón Jardín de Sueños</p>

<div class="container">

<iframe
src="https://maps.google.com/maps?q=buenos%20aires&t=&z=13&ie=UTF8&iwloc=&output=embed"
width="100%" height="350"
style="border-radius:15px;border:none;">
</iframe>

</div>

</section>

<!-- DRESS CODE -->

<section class="section-light">

<h2>Dress Code</h2>

<div class="dress">
Elegante
</div>

</section>

<!-- CONFIRMAR -->

<section class="section-pink">

<h2>Confirmar asistencia</h2>

<a href="https://wa.me/5491112345678" class="btn-confirmar">
Confirmar por WhatsApp
</a>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

var fechaEvento = new Date("July 10, 2026 21:00:00").getTime();

var x = setInterval(function(){

var ahora = new Date().getTime();
var distancia = fechaEvento - ahora;

var dias = Math.floor(distancia / (1000*60*60*24));

document.getElementById("contador").innerHTML =
"Faltan " + dias + " días";

},1000);

</script>

</body>
</html>
